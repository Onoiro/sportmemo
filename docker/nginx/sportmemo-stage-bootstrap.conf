# Временный конфиг стейджа: только HTTP, без TLS.
#
# Зачем он нужен отдельно. Полный конфиг (`sportmemo-stage.conf`) ссылается
# на сертификат, которого ещё нет. Nginx читает `ssl_certificate` при
# проверке конфигурации, поэтому `nginx -t` падает с
# `BIO_new_file() failed ... No such file or directory`, и `reload`
# невозможен. А `certbot --nginx` без валидного конфига тоже не работает —
# получается замкнутый круг.
#
# Порядок выпуска сертификата:
#
#   1. скопировать ЭТОТ файл в `/etc/nginx/conf.d/stage.sportmemo.ru.conf`
#      и сделать `nginx -t && systemctl reload nginx`;
#   2. `certbot certonly --webroot -w /home/abo/sportmemo -d stage.sportmemo.ru`;
#   3. скопировать полный `sportmemo-stage.conf` и снова `nginx -t && reload`.
#
# `--webroot`, а не `--nginx`: плагин nginx правит конфигурацию сам и завёл бы
# второй server-блок с тем же `server_name`, который потом конфликтовал бы
# с нашим эталоном. Webroot только кладёт файл проверки в каталог и ничего
# не меняет.
#
# Владелец каталога `/home/abo/sportmemo` — `abo` (uid 1000), права 775,
# а `/home/abo` — 711: `www-data` может пройти по известному пути и прочитать
# файл проверки, хотя листать каталог не может. Этого достаточно.

server {
    listen 80;
    server_name stage.sportmemo.ru;

    # Проверка Let's Encrypt. `auth_basic off` обязателен: без него ACME
    # получил бы 401 вместо файла, и выпуск провалился бы.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /home/abo/sportmemo;
    }

    # До HTTPS сайт тоже закрыт паролем: стейдж стоит в интернете, и без
    # пароля там за минуты зарегистрировались бы посторонние со своими
    # настоящими email — это ПДн на зарубежном сервере.
    auth_basic "SportMemo stage";
    auth_basic_user_file /etc/nginx/.htpasswd_sportmemo_stage;

    client_max_body_size 30m;

    location /static/ {
        alias /home/abo/sportmemo/staticfiles/;
        expires max;
        access_log off;
    }

    location /media/ {
        alias /home/abo/sportmemo/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
