# Эталон конфигурации стейджа. На сервере лежит копия в
# `/etc/nginx/conf.d/stage.sportmemo.ru.conf`: файл правится здесь,
# а на сервер копируется (`sudo cp`, `nginx -t`, `reload`), не наоборот.
# Иначе следующая правка на сервере потерялась бы при копировании.
#
# Сайт закрыт basic auth целиком: стейдж стоит в интернете, и без пароля
# там зарегистрировался бы кто угодно со своим настоящим email — то есть
# ПДн на зарубежном сервере. Пароль живёт только в
# `/etc/nginx/.htpasswd_sportmemo_stage`, в репозиторий не попадает.

server {
    listen 80;
    server_name stage.sportmemo.ru;

    # Выпуск сертификата: `certbot --nginx` вставляет свой location для
    # http-01, но basic auth на уровне server закрыл бы и его — проверка
    # получила бы 401, и выпуск провалился бы. Отключение стоит заранее.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /home/abo/sportmemo;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` указан явно. Сейчас протокол работает «по наследству»: соседний
    # `stage.lextr.ru.conf` объявил `http2` на том же порту 443, и nginx 1.18
    # включает его на порту целиком. Уберут соседний сайт — HTTP/2 пропадёт
    # молча, а по HTTP/1.1 страница грузится в разы дольше.
    listen 443 ssl http2;
    server_name stage.sportmemo.ru;

    ssl_certificate /etc/letsencrypt/live/stage.sportmemo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.sportmemo.ru/privkey.pem;
    # HSTS включается на боевом домене (5.7), не здесь: стейдж не должен
    # приучать браузер владельца к строгому режиму на временном адресе.

    # `MAX_UPLOAD_BYTES` = 25 МБ, а дефолт nginx 1 МБ отдаёт 413 на первом
    # же снимке с телефона.
    client_max_body_size 30m;

    auth_basic "SportMemo stage";
    auth_basic_user_file /etc/nginx/.htpasswd_sportmemo_stage;

    # `whitenoise` при `collectstatic` кладёт рядом с каждым CSS и JS готовый
    # `.gz` (4 МБ → 1 МБ). Без `gzip_static` nginx отдаёт несжатый файл:
    # bootstrap.css уходит 232 КБ вместо 31 КБ, и на мобильном канале это
    # разница в секунды. `gzip_types` в системном `nginx.conf` закомментирован,
    # поэтому типы заданы здесь: эталон должен работать на чистой машине.
    gzip on;
    gzip_vary on;
    gzip_static on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Статику с манифестом собирает `collectstatic` в скрипте деплоя,
    # а nginx раздаёт её прямо с хоста. `expires max` безопасен: в адресе
    # файла отпечаток содержимого, изменился файл — изменился адрес.
    location /static/ {
        alias /home/abo/sportmemo/staticfiles/;
        expires max;
        access_log off;
    }

    # `USE_S3=False`: оригиналы и производные лежат в `media/` на хосте.
    # Приватности оригиналов здесь нет — защита только basic auth
    # и отсутствие реальных данных на стейдже.
    location /media/ {
        alias /home/abo/sportmemo/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Обязателен: при `DEBUG=False` включён `SECURE_PROXY_SSL_HEADER`,
        # и без него Django считает запрос http. Тогда `SESSION_COOKIE_SECURE`
        # и `CSRF_COOKIE_SECURE` ломают вход и формы.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gunicorn в compose ждёт до 60 с: таймаут nginx должен быть не
        # меньше, иначе браузер получит 504 вместо страницы ошибки.
        proxy_read_timeout 60s;
    }
}
