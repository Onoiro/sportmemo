{% load allauth %}
{% comment %}
    Плашки allauth. Теги задают смысл: `success` — удача, `warning` —
    предупреждение, `danger` — ошибка, остальное — нейтральное сообщение.
{% endcomment %}
<div class="alert {% if 'success' in attrs.tags %}alert-success{% elif 'warning' in attrs.tags %}alert-warning{% elif 'danger' in attrs.tags %}alert-danger{% else %}alert-info{% endif %}"
     role="alert">
    {% slot message %}{% endslot %}
</div>
